<script type="application/ld+json" id="ld-faq">{"@context":"https://schema.org","@type":"FAQPage","inLanguage":"ar","mainEntity":[{"@type":"Question","name":"ما الفرق بين المعالج (CPU) والـ SoC؟","acceptedAnswer":{"@type":"Answer","text":"الـ SoC شريحة تضم CPU وGPU وNPU وISP والمودم وغيرها. كلمة «معالج» في الهواتف تعني عادةً الـ SoC كاملاً."}},{"@type":"Question","name":"هل رقم النانومتر الأصغر أفضل دائماً؟","acceptedAnswer":{"@type":"Answer","text":"غالباً يعني كفاءة أعلى، لكنه ليس ضماناً؛ التصميم والمعمارية والتبريد والبرمجيات تؤثر بقدر كبير."}},{"@type":"Question","name":"هل أحتاج هاتفاً رائداً؟","acceptedAnswer":{"@type":"Answer","text":"ليس بالضرورة. للاستخدام اليومي تكفي الفئات المتوسطة غالباً؛ الرائدة مفيدة للألعاب الثقيلة والتصوير المتقدم وميزات الذكاء الاصطناعي."}},{"@type":"Question","name":"ماذا تعني درجة AnTuTu؟","acceptedAnswer":{"@type":"Answer","text":"رقم شامل لأداء الجهاز في اختبار واحد؛ مفيد للمقارنة التقريبية لكنه لا يعكس كل تجربة الاستخدام."}},{"@type":"Question","name":"لماذا يسخن الهاتف أثناء الألعاب؟","acceptedAnswer":{"@type":"Answer","text":"الأحمال الثقيلة ترفع استهلاك الطاقة والحرارة، فيخفّض النظام الأداء لحماية الجهاز (Thermal Throttling). التبريد جزء أساسي من التجربة."}},{"@type":"Question","name":"ما دور NPU عملياً؟","acceptedAnswer":{"@type":"Answer","text":"يسرّع مهام الذكاء الاصطناعي على الجهاز مثل تحسين الصور والترجمة والتعرف على الصوت دون استهلاك كبير للبطارية."}},{"@type":"Question","name":"هل أنوية Cortex هي نفسها في كل المعالجات؟","acceptedAnswer":{"@type":"Answer","text":"لا. كثير من الشركات تستخدم تصاميم Arm الجاهزة وتعدّل التكوين، وأخرى مثل Apple وQualcomm (Oryon) تصمم أنويتها الخاصة."}},{"@type":"Question","name":"هل الأرقام في الموقع نهائية؟","acceptedAnswer":{"@type":"Answer","text":"المواصفات الأساسية مأخوذة من إعلانات الشركات بحسب علمنا، لكن الأسعار وأي أرقام موسومة «تقريبي» تحتاج تحديثاً يدوياً قبل الاعتماد عليها."}}]}</script>
